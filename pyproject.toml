[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "imd-weather-prediction"
version = "2.0.0"
description = "IMD Weather Prediction Digital Twin v2.0 - Gridded Multi-Horizon Meteorological Forecasting"
authors = [{name = "ML & Meteorological Engineering Team"}]
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "pandas>=2.0.0",
    "scikit-learn>=1.3.0",
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "streamlit>=1.25.0",
    "pyyaml>=6.0",
    "requests>=2.28.0",
    "pydantic>=2.0.0",
    "zarr>=2.14.0",
    "xarray>=2023.1.0",
    "netCDF4>=1.6.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-cov>=4.0.0"
]
